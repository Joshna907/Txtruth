services:
  - type: web
    name: txtruth
    runtime: node
    plan: free
    region: singapore

    # Build the complete workspace in dependency order. The web app imports the
    # generated dist output from @txtruth/core and @txtruth/testkit.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm -r run build
    # Render provides PORT automatically; Next.js reads it from the environment.
    startCommand: corepack enable && pnpm --filter @txtruth/web start
    healthCheckPath: /

    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: SOLANA_DEVNET_RPC_URL
        value: https://api.devnet.solana.com
